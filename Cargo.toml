[package]
name = "formalnotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
nd = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main", features = ["settings-ui"] }
flume = "0.12"
jiff = "0.2"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
pollster = "0.4"
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = "3.4"

[dev-dependencies]
nd = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main", features = ["test", "audit"] }
nd-test = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
tempfile = "3"

[build-dependencies]
nd = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main", default-features = false, features = ["build"] }

# The appearance audit owns the main thread (AppKit), so libtest's harness is off.
[[test]]
name = "appearance"
harness = false

# Key derivation runs SHA-256 1.2 million times; debug builds and tests optimise the hash.
[profile.dev.package]
sha2.opt-level = 3
pbkdf2.opt-level = 3
hmac.opt-level = 3
digest.opt-level = 3

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"

[workspace]

# nd's GPUI patch queue.
[patch.crates-io]
gpui-pre = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-linux = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-linux = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-wgpu = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-fast-wgpu = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
gpui-pre-windows = { git = "https://github.com/FormalStudio/NativeDesktop", branch = "main" }
